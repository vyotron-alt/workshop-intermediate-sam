# Partner paste target: .github/workflows/shared-basics.yml
# on vyotron-alt/workshop-intermediate-{alex,sam} (and template when ready).
# Job *names* must stay aligned with intermediate-portal workshop_signals map.
# No LLM grading — deterministic checks only.
name: Shared basics checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skill-1-git-pr:
    name: skill-1-git-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python skills/git_pr/check.py

  skill-2-cli:
    name: skill-2-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python skills/cli/check.py

  skill-3-read-code:
    name: skill-3-read-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python skills/read_code/check.py

  skill-4-pytest:
    name: skill-4-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  skill-5-http-api:
    name: skill-5-http-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python skills/http_api/check.py

  skill-6-db-lite:
    name: skill-6-db-lite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python skills/db_lite/check.py

  skill-7-deploy:
    name: skill-7-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python skills/deploy/check.py

  skill-8-hardware:
    name: skill-8-hardware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "skill-8 hardware practice mode — never gates own-project unlock"
